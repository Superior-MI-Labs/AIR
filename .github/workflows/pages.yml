name: Publish AIR to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "hf/**"
      - ".github/workflows/pages.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout AIR
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload AIR site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./hf

      - name: Deploy AIR
        id: deployment
        uses: actions/deploy-pages@v4
