name: Adaptive Execution Preflight

on:
  push:
    branches:
      - architecture/adaptive-execution-substrate-r0
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "include/**"
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "docs/adaptive-execution/**"
      - "web/**"
      - ".github/workflows/adaptive-execution-preflight.yml"

concurrency:
  group: adaptive-execution-preflight-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cpu-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             build-essential             cmake             pkg-config             libpcre2-dev             libboost-all-dev

      - name: Adaptive CPU preflight
        run: |
          bash scripts/preflight-adaptive.sh

      - name: Hosted RC hardening
        env:
          AIR_P11_HOSTED_OUT: ${{ runner.temp }}/air-prompt11-hosted
        run: |
          bash scripts/qualify-adaptive-prompt11-hosted.sh build-adaptive-preflight 18911

      - name: Hosted 0.11 release candidate
        env:
          AIR_RELEASE_OUT: ${{ runner.temp }}/AIR-0.11.0-RC
        run: |
          bash scripts/qualify-release-0.11.0-hosted.sh build-adaptive-preflight 18931

      - name: Upload hosted 0.11 release evidence
        uses: actions/upload-artifact@v4
        with:
          name: AIR-0.11.0-hosted-release-candidate
          path: ${{ runner.temp }}/AIR-0.11.0-RC
          if-no-files-found: error
          retention-days: 30
