name: Adaptive Execution Preflight

on:
  push:
    branches:
      - architecture/adaptive-execution-substrate-r0
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "include/**"
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "docs/adaptive-execution/**"
      - ".github/workflows/adaptive-execution-preflight.yml"

concurrency:
  group: adaptive-execution-preflight-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cpu-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             build-essential             cmake             pkg-config             libpcre2-dev             libboost-all-dev

      - name: Adaptive CPU preflight
        run: |
          bash scripts/preflight-adaptive.sh
